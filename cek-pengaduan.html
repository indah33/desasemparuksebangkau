<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cek Pengaduan - Semparuk Sebangkau</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="site-header solid">

    <a class="brand" href="index.html">

        <span>🌿</span>

        <div>
            Semparuk
            <small>Sebangkau</small>
        </div>

    </a>

    <button class="menu-toggle">☰</button>

    <nav class="nav">

        <a href="index.html">Beranda</a>
        <a href="profil.html">Profil</a>
        <a href="wisata.html">Keindahan</a>
        <a href="galeri.html">Galeri</a>
        <a href="kontak.html">Kontak</a>
        <a href="saran.html">Pengaduan</a>
        <a href="login-admin.html">Login Admin</a>

    </nav>

</header>


<main style="max-width:600px;margin:130px auto 60px;padding:20px;">

    <div style="
        background:white;
        padding:30px;
        border-radius:16px;
        box-shadow:0 10px 30px rgba(0,0,0,.08);
    ">

        <h1>Cek Status Pengaduan</h1>

        <p>
            Masukkan ID pengaduan untuk melihat status laporan.
        </p>

        <form id="checkForm">

            <input
                type="text"
                id="complaintId"
                placeholder="Contoh: PGD-20260917-001"
                required
                style="
                    width:100%;
                    padding:13px;
                    box-sizing:border-box;
                    margin:10px 0;
                "
            >

            <button
                type="submit"
                style="
                    width:100%;
                    padding:13px;
                    border:0;
                    border-radius:8px;
                    cursor:pointer;
                "
            >
                Cek Pengaduan
            </button>

        </form>

        <div id="result"
             style="margin-top:25px;">
        </div>

    </div>

</main>


<script src="script.js"></script>
<script src="api-config.js"></script>

<script>

document.getElementById("checkForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const id = document
        .getElementById("complaintId")
        .value
        .trim();

    const result = document.getElementById("result");

    result.innerHTML = "Memeriksa pengaduan...";

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            body: new URLSearchParams({
                action: "cek",
                id: id
            })

        });

        const data = await response.json();

        if (!data.success) {

            result.innerHTML = `
                <div>
                    Pengaduan tidak ditemukan.
                </div>
            `;

            return;
        }

        const item = data.data;

        result.innerHTML = `

            <div style="
                padding:20px;
                border-radius:12px;
                border:1px solid #ddd;
            ">

                <h3>Pengaduan Ditemukan</h3>

                <p>
                    <strong>ID:</strong>
                    ${item.id}
                </p>

                <p>
                    <strong>Tanggal:</strong>
                    ${item.timestamp}
                </p>

                <p>
                    <strong>Kategori:</strong>
                    ${item.kategori}
                </p>

                <p>
                    <strong>Status:</strong>
                    ${item.status}
                </p>

                <p>
                    <strong>Tanggapan:</strong><br>
                    ${item.tanggapan || "Belum ada tanggapan."}
                </p>

            </div>

        `;

    } catch (error) {

        result.innerHTML = `
            Terjadi kesalahan saat menghubungi database.
        `;

        console.error(error);

    }

});

</script>

</body>
</html>
