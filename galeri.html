<main>


<section class="page-hero gallery-hero">

    <div>

        <p class="eyebrow">
            DOKUMENTASI
        </p>

        <h1>
            Galeri<br>
            <em>Semparuk Sebangkau.</em>
        </h1>

        <p>
            Kumpulan foto suasana desa
            yang Anda bagikan.
        </p>

    </div>

</section>


<section class="section">

    <div class="section-heading reveal">

        <p class="eyebrow dark">
            PHOTO STORY
        </p>

        <h2>
            Potongan kecil dari desa.
        </h2>

    </div>


    <div class="gallery">


        <figure class="gallery-item tall reveal">

            <img src="jalanpersawahan.jpg"
                 alt="Jalan kecil dan tanaman pisang">

            <figcaption>
                Jalur kecil di antara hamparan hijau
            </figcaption>

        </figure>


        <figure class="gallery-item reveal">

            <img src="hamparan_persawahan.jpg"
                 alt="Hamparan sawah">

            <figcaption>
                Hamparan padi menjelang panen
            </figcaption>

        </figure>


        <figure class="gallery-item reveal">

            <img src="pemukimandesa.jpg"
                 alt="Permukiman desa">

            <figcaption>
                Suasana permukiman yang rindang
            </figcaption>

        </figure>


        <figure class="gallery-item wide reveal">

            <img src="senja-sebangkau.jpg"
                 alt="Langit senja dan perairan">

            <figcaption>
                Senja yang tenang di tepi air
            </figcaption>

        </figure>


    </div>


    <p class="gallery-hint">
        Klik foto untuk melihat lebih besar.
    </p>

</section>


<div class="lightbox"
     aria-hidden="true">

    <button class="close-lightbox">
        ×
    </button>

    <img src="" alt="">

    <p></p>

</div>


</main>


<footer>
