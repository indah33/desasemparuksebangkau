<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login Admin - Semparuk Sebangkau</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header solid">

    <a class="brand" href="index.html">
        <span>🌿</span>
        <div>
            Semparuk
            <small>Sebangkau</small>
        </div>
    </a>

    <button class="menu-toggle">☰</button>

    <nav class="nav">
        <a href="index.html">Beranda</a>
        <a href="profil.html">Profil</a>
        <a href="wisata.html">Keindahan</a>
        <a href="galeri.html">Galeri</a>
        <a href="kontak.html">Kontak</a>
        <a href="saran.html">Pengaduan</a>
        <a href="login-admin.html">Login Admin</a>
    </nav>

</header>


<main style="max-width:500px;margin:130px auto 60px;padding:20px;">

    <div style="
        background:white;
        padding:30px;
        border-radius:16px;
        box-shadow:0 10px 30px rgba(0,0,0,.08);
    ">

        <h1>Login Admin</h1>

        <p>
            Silakan masuk untuk mengelola pengaduan masyarakat.
        </p>

        <form id="loginForm">

            <label>Username</label>

            <input
                type="text"
                id="username"
                required
                style="
                    width:100%;
                    padding:12px;
                    margin:8px 0 18px;
                    box-sizing:border-box;
                "
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                required
                style="
                    width:100%;
                    padding:12px;
                    margin:8px 0 20px;
                    box-sizing:border-box;
                "
            >

            <button
                type="submit"
                style="
                    width:100%;
                    padding:13px;
                    border:0;
                    border-radius:8px;
                    cursor:pointer;
                "
            >
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

    </div>

</main>


<script src="script.js"></script>
<script src="api-config.js"></script>
<script src="admin.js"></script>

</body>
</html>
