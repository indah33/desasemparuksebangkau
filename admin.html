<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin | Semparuk Sebangkau</title>
<link rel="stylesheet" href="style.css">
<style>
.admin-page{padding:55px 6vw 90px;background:var(--paper);min-height:75vh}
.admin-head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}
.admin-head h1{font-size:48px;margin-bottom:8px}.admin-head p{color:var(--muted);margin:0}
.admin-actions{display:flex;gap:10px}.admin-actions button{border:0;cursor:pointer}
.stats-admin{max-width:1200px;margin:0 auto 25px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat-admin{background:var(--cream);padding:22px;border:1px solid var(--line)}.stat-admin strong{display:block;font:600 35px 'Playfair Display',serif;color:var(--green)}.stat-admin span{color:var(--muted);font-size:13px}
.table-wrap{max-width:1200px;margin:auto;overflow:auto;background:var(--cream);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}th{background:#e9e5da;color:var(--green)}td small{color:var(--muted)}
.status-admin{font-weight:700}.status-admin.Menunggu{color:#8a7118}.status-admin.Ditanggapi{color:#2d7045}.status-admin.Ditolak{color:#9b3b3b}
.action-box{min-width:220px}.action-box textarea{margin:0 0 7px;min-height:65px}.action-box button{border:0;cursor:pointer;margin:3px 3px 0 0;padding:8px 10px;font-weight:700}.btn-response{background:var(--green);color:white}.btn-reject{background:#ead1d1;color:#7a3030}
.admin-msg{max-width:1200px;margin:15px auto;color:var(--green);font-weight:700}
.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:700px){.admin-head{display:block}.admin-actions{margin-top:15px}.stats-admin{grid-template-columns:1fr}.admin-head h1{font-size:40px}}
</style>
</head>
<body>
<header class="site-header solid">
<a class="brand" href="index.html"><span>🌿</span><span>Semparuk<small>Sebangkau</small></span></a>
<nav class="nav"><a href="index.html">Beranda</a><a href="profil.html">Profil</a><a href="wisata.html">Keindahan</a><a href="galeri.html">Galeri</a><a href="kontak.html">Kontak</a><a href="saran.html">Pengaduan</a></nav>
<button class="menu-toggle" aria-label="Menu">☰</button>
</header>
<main class="admin-page">
<div class="admin-head"><div><p class="eyebrow dark">PENGELOLAAN</p><h1>Dashboard Admin</h1><p>Kelola pengaduan masyarakat dari Google Sheets.</p></div><div class="admin-actions"><button class="btn btn-dark" id="refresh">↻ Refresh</button><button class="btn btn-ghost" id="logout" style="background:var(--green)">Keluar</button></div></div>
<div class="stats-admin"><div class="stat-admin"><strong id="total">0</strong><span>Total Pengaduan</span></div><div class="stat-admin"><strong id="waiting">0</strong><span>Menunggu</span></div><div class="stat-admin"><strong id="done">0</strong><span>Ditanggapi</span></div></div>
<p class="admin-msg" id="adminMsg"></p>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Tanggal</th><th>Nama</th><th>Kategori</th><th>Pengaduan</th><th>Status</th><th>Tanggapan / Aksi</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<footer><div><strong>Semparuk Sebangkau</strong><span>Website keindahan desa</span></div><p>© <span id="year"></span> Semparuk Sebangkau</p></footer>
<script src="api-config.js"></script><script src="script.js"></script><script src="admin.js"></script>
</body>
</html>
