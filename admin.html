<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Pengaduan - Semparuk Sebangkau</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="site-header solid">

    <a class="brand" href="index.html">
        <span>🌿</span>

        <div>
            Semparuk
            <small>Sebangkau</small>
        </div>
    </a>

    <button class="menu-toggle">☰</button>

    <nav class="nav">

        <a href="index.html">Beranda</a>
        <a href="profil.html">Profil</a>
        <a href="wisata.html">Keindahan</a>
        <a href="galeri.html">Galeri</a>
        <a href="kontak.html">Kontak</a>
        <a href="saran.html">Pengaduan</a>

    </nav>

</header>


<main style="max-width:1100px;margin:130px auto 60px;padding:20px;">

    <div style="
        background:white;
        padding:25px;
        border-radius:16px;
        box-shadow:0 10px 30px rgba(0,0,0,.08);
    ">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:15px;
            flex-wrap:wrap;
        ">

            <div>
                <h1>Data Pengaduan</h1>

                <p>
                    Kelola pengaduan masyarakat Desa Semparuk Sebangkau.
                </p>
            </div>

            <button onclick="logoutAdmin()">
                Keluar
            </button>

        </div>

        <hr>

        <div id="adminMessage"></div>

        <div style="overflow-x:auto;">

            <table
                border="1"
                cellpadding="10"
                cellspacing="0"
                width="100%"
            >

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Tanggal</th>
                        <th>Nama</th>
                        <th>Kontak</th>
                        <th>Kategori</th>
                        <th>Pengaduan</th>
                        <th>Status</th>
                        <th>Tanggapan</th>
                        <th>Aksi</th>
                    </tr>

                </thead>

                <tbody id="complaintTable">

                    <tr>
                        <td colspan="9">
                            Memuat data...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>


<script src="script.js"></script>
<script src="api-config.js"></script>
<script src="admin.js"></script>

</body>
</html>
